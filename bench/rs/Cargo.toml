[package]
name = "od-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MyGo + Rust experiment: Rust ports of the OpenDecks analysis, library-import and hashing hot paths, plus the ONNX stem path, for benchmarking only."
publish = false

[dependencies]
rayon = "1.10"
sha2 = "0.10"
ring = "0.17"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[features]
default = []
# The ONNX stem path (od-stems). ort 2.0.0-rc.9 targets the ONNX Runtime 1.20
# C API and loads the very same onnxruntime 1.20.1 library that the app's
# onnxruntime-node ships (load-dynamic), so only the host language differs.
stems = ["dep:ort", "dep:num_cpus"]
directml = ["stems", "ort/directml"]
coreml = ["stems", "ort/coreml"]
xnnpack = ["stems", "ort/xnnpack"]

[dependencies.ort]
version = "=2.0.0-rc.9"
optional = true
default-features = false
features = ["ndarray", "load-dynamic", "half"]

[dependencies.num_cpus]
version = "1.16"
optional = true

[[bin]]
name = "od-stems"
required-features = ["stems"]

