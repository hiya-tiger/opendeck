name: rust-native-bench
# Rust-native OpenDecks stack vs today's Electron build (docs/benchmarks/rust-native.md).
# Experiment branch only; nothing here ships. Every number is printed as `RESULT {json}` in
# the job log (artifacts are uploaded too, but the report reads the logs).
on:
  workflow_dispatch:
  push:
    branches: [experiment/rust-native-bench]
    paths: ["native/**", ".github/workflows/rust-native-bench.yml"]

concurrency:
  group: rust-native-bench
  cancel-in-progress: true

jobs:
  licences:
    name: cargo-deny licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-deny }
      - name: cargo deny (core prototype, all targets)
        run: cd native && cargo deny check licenses
      - name: licence table (core)
        run: cd native && python3 tools/licence_table.py . | tee ../licences-core.md
      - name: cargo deny (UI toolkit comparison; report only, Slint is expected to fail)
        run: |
          cd native/ui
          cp ../deny.toml deny.toml
          cargo deny check licenses 2>&1 | grep -E "^(error|warning)\[|rejected|=" | head -n 200 || true
          python3 ../tools/licence_table.py . | tee ../../licences-ui.md
      - uses: actions/upload-artifact@v4
        with: { name: licences, path: "licences-*.md" }

  bench:
    name: bench (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows, exe: ".exe", eps: "cpu,dml" }
          - { os: macos-latest, label: macos, exe: "", eps: "cpu,coreml" }
          - { os: ubuntu-latest, label: linux, exe: "", eps: "cpu" }
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      RN: native/target/release/rn-bench${{ matrix.exe }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Linux packages (+ ALSA loopback for round-trip)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq build-essential pkg-config libasound2-dev libclang-dev xvfb mesa-vulkan-drivers libvulkan1 \
            libxkbcommon-dev libwayland-dev libfontconfig1-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libnss3 libgbm1 ffmpeg >/dev/null
          sudo apt-get install -yq "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 || echo "no modules-extra for $(uname -r)"
          if sudo modprobe snd-aloop; then
            echo "snd-aloop loaded"; cat /proc/asound/cards
            sudo usermod -aG audio "$USER" || true
            sudo chmod a+rw /dev/snd/* || true
            printf 'pcm.!default { type plug slave.pcm "hw:Loopback,0,0" }\nctl.!default { type hw card Loopback }\n' > ~/.asoundrc
            echo "RN_LOOP_OUT=CARD=Loopback,DEV=0" >> $GITHUB_ENV
            echo "RN_LOOP_IN=CARD=Loopback,DEV=1" >> $GITHUB_ENV
          else
            echo "snd-aloop unavailable: audio benches will report no device"
          fi
      - run: pip install psutil numpy==2.1.3 onnx==1.17.0 onnxconverter-common==1.14.0 onnxruntime==1.20.1
      - name: DirectML venv (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m venv dmlenv
          dmlenv/Scripts/python -m pip install -q numpy==2.1.3 onnxruntime-directml==1.20.1
      - name: Build Rust prototype
        run: cd native && cargo build --release -p rn-bench && cargo test --release -p rn-engine 2>&1 | tail -n 5
      - name: Bench decode (Symphonia + libopus)
        if: always()
        run: $RN decode native/fixtures/audio
      - name: Bench stretch (Signalsmith Stretch)
        if: always()
        run: $RN stretch
      - name: Bench jog (scratch / nudge / back-spin / brake / MIDI)
        if: always()
        run: $RN jog
      - name: Bench audio I/O (CPAL)
        if: always()
        run: |
          if [ "$RUNNER_OS" = Linux ]; then $RN audio 10 || true; else $RN audio 10 || true; fi
      - name: Bench library DB (rusqlite bundled, 100k tracks)
        if: always()
        run: $RN db 100000
      - name: Bench render (wgpu + vello, headless)
        if: always()
        run: $RN render 300 || echo "RESULT {\"kind\":\"render\",\"ok\":false,\"error\":\"process failed\"}"
      - name: Electron baseline (today's build, same fixtures)
        if: always()
        run: |
          npm ci --no-audit --no-fund >/dev/null
          node native/electron-baseline/build.mjs
          E="$(node -p "require('electron')")"
          if [ "$RUNNER_OS" = Linux ]; then
            timeout 1500 xvfb-run -a -s "-screen 0 1920x1080x24" "$E" --no-sandbox native/electron-baseline/main.cjs native/fixtures/audio 2>electron.err || true
          else
            timeout 1500 "$E" native/electron-baseline/main.cjs native/fixtures/audio 2>electron.err || true
          fi
          grep -v -i dbus electron.err | tail -n 20 || true
      - name: Model cache
        if: always()
        uses: actions/cache@v4
        with: { path: model, key: htdemucs-onnx-fp32-fp16w-v1 }
      - name: Stem models (download MIT export, derive int8/fp16 here)
        if: always()
        run: |
          mkdir -p model
          [ -f model/htdemucs.onnx ] || curl -sSL -o model/htdemucs.onnx https://huggingface.co/StemSplitio/htdemucs-onnx/resolve/main/htdemucs.onnx
          [ -f model/htdemucs_fp16weights.onnx ] || curl -sSL -o model/htdemucs_fp16weights.onnx https://huggingface.co/StemSplitio/htdemucs-onnx/resolve/main/htdemucs_fp16weights.onnx
          python - <<'EOF'
          import hashlib
          for f, want in [("model/htdemucs.onnx", "68d0bf16428ef66e692cdff8a9ccf28f1ef3f69440d57e58605a4cc55fcc5e74"), ("model/htdemucs_fp16weights.onnx", "d05c269d0178d2a72ad484b10b11dd370193fc923201c3b27a99f848745db70a")]:
              h = hashlib.sha256(open(f, "rb").read()).hexdigest()
              print(f, h, "OK" if h == want else "MISMATCH"); assert h == want
          EOF
          python native/stems/derive_models.py model int8-dyn-matmul int8-dyn fp16 2>&1 | grep -v UserWarning | grep -v warnings.warn
      - name: Bench stems (CPU + available GPU EPs)
        if: always()
        run: |
          python native/stems/bench_stems.py --models model --variants fp16weights,fp32,int8-dyn-matmul,int8-dyn,fp16 --eps cpu --chunks 3 --multi || true
          if [ "$RUNNER_OS" = Windows ]; then dmlenv/Scripts/python native/stems/bench_stems.py --models model --variants fp16weights,fp32,int8-dyn,fp16 --eps dml --chunks 3 || true; fi
          if [ "$RUNNER_OS" = macOS ]; then python native/stems/bench_stems.py --models model --variants fp16weights,fp32,int8-dyn,fp16 --eps coreml --chunks 3 || true; fi
      - name: Stems quality (SDR, MUSDB18 7 s excerpts, Linux only)
        if: always() && runner.os == 'Linux'
        run: |
          curl -sSL -o m7.zip https://zenodo.org/api/records/3270814/files/MUSDB18-7-STEMS.zip/content && unzip -q m7.zip -d m7
          mkdir -p ref
          ls m7/test | head -n 8 | while read -r f; do n=$(echo "$f" | sed 's/.stem.mp4//; s/[^A-Za-z0-9]/_/g'); mkdir -p "ref/$n"; k=0; for s in mixture drums bass other vocals; do ffmpeg -v error -y -i "m7/test/$f" -map 0:a:$k -ac 2 -ar 44100 -f f32le "ref/$n/$s.f32"; k=$((k+1)); done; done
          python native/stems/bench_stems.py --models model --variants fp16weights,fp32,int8-dyn-matmul,int8-dyn,fp16 --no-speed --ref ref --ref-limit 8 || true
      - name: Build UI prototypes (egui, Slint, Tauri 2)
        if: always()
        run: |
          cd native/ui
          for p in ui-egui ui-slint ui-tauri; do cargo build --release -p $p 2>&1 | tail -n 3; done
          for p in ui-egui ui-slint ui-tauri; do f=target/release/$p${{ matrix.exe }}; [ -f "$f" ] && echo "RESULT {\"kind\":\"ui_size\",\"toolkit\":\"${p#ui-}\",\"bytes\":$(wc -c < "$f")}"; done
          node -e "const fs=require('fs'),p=require('path');const d=p.dirname(require('electron'));let t=0;const w=x=>{for(const f of fs.readdirSync(x,{withFileTypes:true})){const q=p.join(x,f.name);if(f.isDirectory())w(q);else if(!f.isSymbolicLink())t+=fs.statSync(q).size}};w('${{ runner.os }}'==='macOS'?p.resolve(d,'../../..'):d);console.log('RESULT '+JSON.stringify({kind:'ui_size',toolkit:'electron',bytes:t,note:'whole Electron dist (runtime); app code excluded'}))"
      - name: Bench UI toolkits
        if: always()
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          E="$(node -p "require('electron')")"
          for p in egui slint tauri; do
            f=native/ui/target/release/ui-$p${{ matrix.exe }}
            [ -f "$f" ] || { echo "RESULT {\"kind\":\"ui_measure\",\"toolkit\":\"$p\",\"ok\":false,\"error\":\"not built\"}"; continue; }
            if [ "$RUNNER_OS" = Linux ]; then timeout 900 python native/tools/ui_measure.py $p xvfb-run -a -s "-screen 0 1920x1080x24" "$f" || true
            else timeout 900 python native/tools/ui_measure.py $p "$f" || true; fi
          done
          if [ "$RUNNER_OS" = Linux ]; then timeout 900 python native/tools/ui_measure.py electron xvfb-run -a -s "-screen 0 1920x1080x24" "$E" --no-sandbox native/ui/ui-electron/main.cjs || true
          else timeout 900 python native/tools/ui_measure.py electron "$E" native/ui/ui-electron/main.cjs || true; fi
