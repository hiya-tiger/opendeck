[package]
name = "opendeck-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sample-accurate PCM transport for OpenDeck: voices, reverse playback and loops."

[dependencies]
cpal = { version = "0.15", optional = true, default-features = false }
symphonia = { version = "0.5", optional = true, default-features = false, features = [
    "mp3",
    "aac",
    "isomp4",
    "flac",
    "vorbis",
    "wav",
    "aiff",
    "pcm",
    "adpcm",
] }

[features]
default = []
native-output = ["dep:cpal"]
decode = ["dep:symphonia"]
