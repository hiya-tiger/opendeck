[package]
name = "opendeck-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sample-accurate PCM transport for OpenDecks: voices, reverse playback and loops."

[dependencies]
cpal = { version = "0.15", optional = true, default-features = false }
symphonia = { version = "0.5", optional = true, default-features = false, features = [
    "mp3",
    "aac",
    "isomp4",
    "flac",
    "vorbis",
    "wav",
    "aiff",
    "pcm",
    "adpcm",
] }

[features]
default = []
native-output = ["dep:cpal"]
decode = ["dep:symphonia"]

# The M2 playback probe is an example target, so a plain `cargo build` or
# `cargo test` never builds it. It also needs both features, which are not in
# `default`, and the runtime gate in `cpal_out::probe_gate_from_env`.
[[example]]
name = "play_probe"
path = "examples/play_probe.rs"
required-features = ["native-output", "decode"]
