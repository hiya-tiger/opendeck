[package]
name = "opendeck-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenDecks Tauri shell: Rust core behind the existing OpenDecks UI."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opendeck-core = { path = "../opendeck-core" }
opendeck-audio = { path = "../opendeck-audio", features = ["decode"] }
ureq = "2"
rfd = "0.15"
sha1 = "0.10"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"

