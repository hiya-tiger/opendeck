[package]
name = "od-stems"
description = "OpenDecks stems: progressive chunk scheduler from the playhead behind a StemEngine trait (ORT backend)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
ort = ["dep:ort"]

[dependencies]
od-core.workspace = true

[dependencies.ort]
version = "=2.0.0-rc.9"
optional = true
default-features = false
features = ["ndarray", "load-dynamic", "half"]
