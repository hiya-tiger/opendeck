[package]
name = "od-stems"
description = "OpenDecks stems: progressive chunk scheduler from the playhead behind a StemEngine trait (ORT backend)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
ort = ["dep:ort", "dep:num_cpus", "dep:serde_json"]

[dependencies]
od-core.workspace = true
num_cpus = { version = "1.16", optional = true }
serde_json = { workspace = true, optional = true }

[dependencies.ort]
version = "=2.0.0-rc.9"
optional = true
default-features = false
features = ["ndarray", "load-dynamic", "half"]

[dev-dependencies]
serde_json.workspace = true

[[bin]]
name = "od-stems-bench"
required-features = ["ort"]
