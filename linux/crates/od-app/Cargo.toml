[package]
name = "od-app"
description = "OpenDecks for Linux: egui (eframe + wgpu) user interface"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "opendecks"
path = "src/main.rs"

[dependencies]
od-core.workspace = true
od-audio.workspace = true
od-stems.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.33", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
egui = "0.33"
midir = "0.10"
rayon.workspace = true
assert_no_alloc = "1.1"
