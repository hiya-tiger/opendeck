[package]
name = "od-audio"
description = "OpenDecks real-time audio engine: 4 decks, key-lock, EQ/FX, mixer, cue bus, sampler, recorder"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
jack = ["cpal/jack"]

[dependencies]
od-core.workspace = true
cpal = "0.15"
rtrb = "0.3"
signalsmith-stretch = "0.1.3"
hound = "3.5"
claxon = "0.4"
lewton = "0.10"
minimp3 = "0.5"
assert_no_alloc = "1.1"

