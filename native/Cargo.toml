[workspace]
resolver = "2"
members = ["crates/rn-engine", "crates/rn-render", "crates/rn-bench"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
debug = false
codegen-units = 4

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
