# UI toolkit comparison (egui vs Slint vs Tauri 2). Separate workspace so the main licence
# gate (../deny.toml) never sees Slint's GPL-3.0-or-commercial expression.
[workspace]
resolver = "2"
members = ["ui-egui", "ui-slint", "ui-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 4
