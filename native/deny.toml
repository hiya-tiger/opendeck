# Licence gate for the Rust-native OpenDecks prototype (closed-source-capable release).
# Allowed: permissive, royalty-free licences that permit proprietary distribution.
# Not allowed: GPL / LGPL / AGPL / SSPL / any copyleft that reaches the larger work.
# MPL-2.0 is file-level copyleft: it permits a closed-source larger work, but changes to the
# MPL files themselves must be published. It is allowed ONLY for the Symphonia crates (the
# requested decoder), via `exceptions`, and recorded in docs/benchmarks/rust-native.md.
[graph]
all-features = false
no-default-features = false

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0", "CC0-1.0", "Unlicense", "0BSD", "bzip2-1.0.6",
]
exceptions = [
  { allow = ["MPL-2.0"], crate = "symphonia" },
  { allow = ["MPL-2.0"], crate = "symphonia-core" },
  { allow = ["MPL-2.0"], crate = "symphonia-metadata" },
  { allow = ["MPL-2.0"], crate = "symphonia-utils-xiph" },
  { allow = ["MPL-2.0"], crate = "symphonia-bundle-mp3" },
  { allow = ["MPL-2.0"], crate = "symphonia-bundle-flac" },
  { allow = ["MPL-2.0"], crate = "symphonia-codec-aac" },
  { allow = ["MPL-2.0"], crate = "symphonia-codec-alac" },
  { allow = ["MPL-2.0"], crate = "symphonia-codec-vorbis" },
  { allow = ["MPL-2.0"], crate = "symphonia-codec-pcm" },
  { allow = ["MPL-2.0"], crate = "symphonia-codec-adpcm" },
  { allow = ["MPL-2.0"], crate = "symphonia-format-isomp4" },
  { allow = ["MPL-2.0"], crate = "symphonia-format-ogg" },
  { allow = ["MPL-2.0"], crate = "symphonia-format-mkv" },
  { allow = ["MPL-2.0"], crate = "symphonia-format-riff" },
  { allow = ["MPL-2.0"], crate = "symphonia-format-caf" },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[advisories]
version = 2
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
