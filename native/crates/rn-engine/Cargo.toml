[package]
name = "rn-engine"
description = "OpenDecks native prototype engine: decode (Symphonia), decks + jog (Signalsmith Stretch), MIDI jog, library (rusqlite)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["opus"]
opus = ["dep:symphonia-adapter-libopus"]

[dependencies]
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "aac", "isomp4", "alac", "flac", "vorbis", "ogg", "mkv", "wav", "aiff", "pcm", "adpcm"] }
symphonia-adapter-libopus = { version = "0.2.9", optional = true }
signalsmith-stretch = "0.1.3"
rusqlite = { version = "0.32", features = ["bundled"] }
